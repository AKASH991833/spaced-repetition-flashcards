<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RecallDeck - Spaced Repetition Flashcards</title>
<meta name="description" content="Remember anything with the SM-2 spaced repetition algorithm. Decks, rich cards, study sessions, stats and import/export. Free, offline PWA.">
<script>(function(){var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="16" rx="2"/><path d="M6 6V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2"/></svg></span>
      <span>RecallDeck<small>Spaced repetition, done right</small></span></div>
    <div class="spacer"></div>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <main class="container">
    <section id="view-decks">
      <div class="grid grid-4" id="statCards" style="margin-bottom:16px"></div>
      <div class="card">
        <div class="row between"><h2 class="mb-0">Your decks</h2>
          <div class="row">
            <button class="btn btn-ghost btn-sm" onclick="exportAll()">Export</button>
            <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">Import</button>
            <input type="file" id="importFile" accept=".json,.tsv,.txt,.csv" hidden onchange="importDeck(this)">
            <button class="btn btn-primary btn-sm" onclick="newDeck()">+ New deck</button>
          </div></div>
        <div id="deckList" style="margin-top:16px"></div>
      </div>
    </section>
    <section id="view-deck" hidden>
      <div class="row between" style="margin-bottom:14px;flex-wrap:wrap">
        <div class="row"><button class="btn btn-ghost" onclick="closeDeck()">&larr; Decks</button><h2 class="mb-0" id="deckName"></h2></div>
        <div class="row">
          <button class="btn btn-primary" id="studyBtn" onclick="startStudy()">Study now</button>
          <button class="btn btn-ghost" onclick="browseCards()">Browse cards</button>
          <button class="btn btn-ghost" onclick="renameDeck()" style="color:var(--bad)">Delete deck</button>
        </div>
      </div>
      <div class="grid grid-3" id="deckStats" style="margin-bottom:16px"></div>
      <div class="card">
        <h3>Add a card</h3>
        <div class="grid grid-2">
          <div class="field"><label>Front</label><textarea class="input" id="cardFront" rows="3" placeholder="Question / term"></textarea></div>
          <div class="field"><label>Back</label><textarea class="input" id="cardBack" rows="3" placeholder="Answer / meaning"></textarea></div>
        </div>
        <button class="btn btn-primary" onclick="addCard()">Add card</button>
      </div>
      <div id="cardList" style="margin-top:16px"></div>
    </section>
    <section id="view-study" hidden>
      <div class="row between" style="margin-bottom:12px">
        <button class="btn btn-ghost" onclick="endStudy()">&larr; End session</button>
        <span class="chip chip-accent" id="studyProgress"></span>
      </div>
      <div class="flashcard" id="studyCard" onclick="flipStudy()" role="button" tabindex="0" aria-label="Flashcard - tap to flip">
        <div class="fc-face fc-front"><div class="study-text" id="studyFront"></div><div class="muted small" style="margin-top:16px">Tap to reveal answer</div></div>
        <div class="fc-face fc-back"><div class="study-text" id="studyBack"></div></div>
      </div>
      <div class="grade-row" id="gradeRow" hidden>
        <button class="grade g1" onclick="grade(1)">Again<span>&lt;1 min</span></button>
        <button class="grade g2" onclick="grade(2)">Hard<span id="iv2"></span></button>
        <button class="grade g3" onclick="grade(3)">Good<span id="iv3"></span></button>
        <button class="grade g4" onclick="grade(4)">Easy<span id="iv4"></span></button>
      </div>
      <div class="card" id="studyDone" hidden style="text-align:center;margin-top:16px">
        <h2>Session complete</h2>
        <p class="muted" id="studySummary"></p>
        <button class="btn btn-primary" onclick="closeDeck()">Back to deck</button>
      </div>
    </section>
  </main>
  <footer class="muted small" style="text-align:center;padding:18px">SM-2 algorithm · Works offline · Data stays on your device</footer>
</div>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
